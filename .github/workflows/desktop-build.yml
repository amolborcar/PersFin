name: Desktop build

# Builds the unsigned standalone macOS desktop app (.dmg). macOS is the only
# supported platform. Run manually from the Actions tab, or automatically when
# a v* tag is pushed.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: macos-latest
    runs-on: macos-latest
    # Needed so the tag build can attach the installer to the GitHub Release.
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      # Never attempt code signing — these are intentionally unsigned builds.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          # --ignore-scripts on server skips building better-sqlite3 here — tsc
          # only needs its types; the native module is built later in the stage
          # step (for Electron's ABI). desktop keeps scripts (electron postinstall).
          npm ci --prefix server --ignore-scripts
          npm ci --prefix client
          npm ci --prefix desktop

      - name: Build, stage, and package
        run: npm run desktop:dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PersFin-macos
          path: desktop/dist-app/*.dmg
          if-no-files-found: error

      # On a v* tag, also attach the raw installer to that tag's GitHub Release so
      # it's a public download on the Release page (artifacts above are auth-gated
      # and expire). Skipped for manual workflow_dispatch runs (no tag/release).
      - name: Attach installer to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist-app/*.dmg
